<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Review — Administration</title>
<meta name="robots" content="noindex, nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg:#EDF1F2; --card:#FFFFFF;
    --ink:#0F2331; --ink-soft:#5A7183; --ink-faint:#8CA0AE;
    --navy:#0B2545; --teal:#1F7A6C; --teal-bg:#E4F1EE;
    --amber:#C77B18; --amber-bg:#FBF0DE;
    --red:#A93B2E; --red-bg:#F8E4E1;
    --violet:#5B4A8A; --violet-bg:#ECE8F5;
    --line:#D3DDE1; --line-soft:#E5EBEE;
    /* analysis status palette (maps onto the app's verdicts:
       risk→coverage, stale→source, emergent stays emergent) */
    --aligned:#1F7A6C;   --aligned-bg:#E4F1EE;
    --ownership:#3A6EA5; --ownership-bg:#E4EDF6;
    --source:#C77B18;    --source-bg:#FBF0DE;
    --stale:#8A5A00;     --stale-bg:#F7EEDD;
    --coverage:#A93B2E;  --coverage-bg:#F8E4E1;
    --omission:#7A2118;  --omission-bg:#F3D9D5;
    --sequence:#6B7A8F;  --sequence-bg:#EAEEF2;
    --emergent:#5B4A8A;  --emergent-bg:#ECE8F5;
    --none:#B9C6CC;      --none-bg:#F0F3F4;
    --mono:'IBM Plex Mono', monospace; --sans:'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans);
        display:flex; flex-direction:column; min-height:100vh; }
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;}

  /* ---------- CHROME ---------- */
  .topbar{ background:var(--navy); color:#EAF1F4; padding:12px 24px;
           display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .topbar .brand{ font-family:var(--mono); font-weight:600; font-size:14px; cursor:pointer; }
  .topbar .crumb{ font-size:12px; color:#8FB0C4; }
  .topbar .crumb b{ color:#EAF1F4; font-weight:500; }
  .topbar .spacer{flex:1;}
  .ghost-btn{ background:transparent; border:1px solid #35597A; color:#B7CCD8;
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.6px;
    padding:6px 12px; border-radius:4px; cursor:pointer; }
  .ghost-btn:hover{ background:#173654; color:#fff; }
  .ghost-btn.warn:hover{ background:#5A2019; border-color:#8A3428; color:#fff; }

  .progress-strip{ display:flex; gap:3px; padding:10px 24px; background:#0E2C51; }
  .pip{ flex:1; height:5px; border-radius:3px; background:#20456B; cursor:pointer; }
  .pip:hover{ background:#2E5C88; }
  .pip.answered{ background:#4E92B8; }
  .pip.current{ background:#EAF1F4; }

  .stage{ flex:1; display:flex; justify-content:center; padding:34px 24px 70px; }
  .sheet{ width:100%; max-width:880px; }
  .sheet.wide{ max-width:1040px; }

  /* ---------- SHARED ---------- */
  h2.page{ font-family:var(--mono); font-weight:700; font-size:24px; letter-spacing:-0.4px; margin-bottom:7px; }
  p.lede{ font-size:14px; color:var(--ink-soft); line-height:1.55; max-width:620px; margin-bottom:24px; }
  .label{ font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.8px;
          color:var(--ink-soft); margin-bottom:9px; }
  .label .hint{ display:block; font-family:var(--sans); text-transform:none; letter-spacing:0;
                font-size:12.5px; color:var(--ink-faint); margin-top:4px; font-weight:400; }
  .btn{ font-family:var(--mono); font-size:12px; letter-spacing:0.4px; padding:10px 18px;
        border-radius:6px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn.primary{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .btn.primary:hover{ background:#153A63; }
  .btn.danger{ color:var(--red); border-color:#E4C4BF; }
  .btn.danger:hover{ background:var(--red-bg); }
  .btn.sm{ padding:7px 12px; font-size:11px; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .row{ display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  .spacer{flex:1;}
  .save-hint{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); }

  input[type=text].fld, textarea.fld, select.fld{
    width:100%; border:1.5px solid var(--line); border-radius:6px; padding:10px 12px;
    font-size:14px; color:var(--ink); background:#fff; }
  textarea.fld{ min-height:64px; resize:vertical; line-height:1.5; }
  input.fld:focus, textarea.fld:focus, select.fld:focus{
    outline:2px solid var(--navy); outline-offset:1px; border-color:var(--navy); }
  .field{ margin-bottom:16px; }
  .field > label{ display:block; font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
                  letter-spacing:0.7px; color:var(--ink-soft); margin-bottom:6px; }

  .sectlabel{margin-bottom:10px}
  .empty-state{ background:var(--card); border:1.5px dashed var(--line); border-radius:10px;
    padding:44px 28px; text-align:center; }
  .empty-state h3{ font-family:var(--mono); font-size:16px; margin-bottom:8px; }
  .empty-state p{ font-size:13.5px; color:var(--ink-soft); line-height:1.55; max-width:400px;
    margin:0 auto 18px; }

  /* ---------- PROCESS LIBRARY ---------- */
  .plist{ display:grid; gap:11px; }
  .pcard{ background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:17px 19px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .pcard .pinfo{ flex:1; min-width:220px; }
  .pcard .pname{ font-weight:600; font-size:16px; margin-bottom:4px; }
  .pcard .pmeta{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); }
  .pcard .pmeta .sep{ margin:0 7px; opacity:0.5; }
  .statuschip{ font-family:var(--mono); font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.5px; padding:4px 8px; border-radius:4px; }
  .statuschip.draft{ background:#EEF1F2; color:var(--ink-faint); }
  .statuschip.ready{ background:var(--teal-bg); color:var(--teal); }
  .statuschip.inprog{ background:var(--amber-bg); color:var(--amber); }
  .statuschip.done{ background:#E6ECF2; color:var(--navy); }

  /* ---------- ADMIN: STEP EDITOR ---------- */
  .steplist{ display:grid; gap:9px; margin-bottom:18px; }
  .sedit{ background:var(--card); border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .sedit.open{ border-color:var(--navy); }
  .sedit-head{ display:flex; gap:12px; align-items:center; padding:13px 16px; cursor:pointer; }
  .sedit-head .sid{ font-family:var(--mono); font-weight:700; font-size:12px; color:var(--navy);
    background:var(--bg); border:1px solid var(--line); padding:3px 8px; border-radius:4px; white-space:nowrap; }
  .sedit-head .sname{ flex:1; font-weight:600; font-size:14.5px; min-width:120px; }
  .sedit-head .sname.untitled{ color:var(--ink-faint); font-weight:400; font-style:italic; }
  .sedit-head .scount{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); }
  .sedit-head .chev{ font-family:var(--mono); color:var(--ink-faint); transition:transform .2s; }
  .sedit.open .chev{ transform:rotate(90deg); }
  .sedit-body{ display:none; border-top:1px solid var(--line); padding:18px 16px; background:#FAFCFC; }
  .sedit.open .sedit-body{ display:block; }

  .officepick{ display:flex; gap:7px; }
  .officepick button{ flex:1; border:1.5px solid var(--line); background:#fff; border-radius:6px;
    padding:9px; cursor:pointer; font-size:13px; color:var(--ink-soft); }
  .officepick button.on{ border-color:var(--navy); background:#E6ECF2; color:var(--navy); font-weight:600; }

  .agreetoggle{ display:flex; gap:10px; align-items:flex-start; background:#fff;
    border:1.5px solid var(--line); border-radius:7px; padding:12px 14px; margin-bottom:18px; cursor:pointer; }
  .agreetoggle input{ margin-top:2px; accent-color:var(--navy); cursor:pointer; }
  .agreetoggle .t{ font-size:13.5px; font-weight:600; }
  .agreetoggle .d{ font-size:12.5px; color:var(--ink-soft); line-height:1.45; margin-top:2px; }

  .vergrid{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .vergrid.single{ grid-template-columns:1fr; }
  .verbox{ background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:14px 15px; }
  .verbox.global{ border-top:3px solid var(--teal); }
  .verbox.local{ border-top:3px solid var(--amber); }
  .verbox h6{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.7px;
    margin-bottom:4px; }
  .verbox.global h6{ color:var(--teal); }
  .verbox.local h6{ color:var(--amber); }
  .verbox .vdesc{ font-size:11.5px; color:var(--ink-faint); line-height:1.45; margin-bottom:12px; }
  .subrow{ display:flex; gap:7px; align-items:flex-start; margin-bottom:8px; }
  .subrow .sref{ width:38px; flex-shrink:0; text-align:center; font-family:var(--mono); font-size:12px;
    border:1.5px solid var(--line); border-radius:5px; padding:8px 2px; }
  .subrow textarea{ flex:1; min-height:56px; resize:vertical; font-size:13px; line-height:1.45;
    border:1.5px solid var(--line); border-radius:5px; padding:8px 9px; }
  .subrow .del{ border:none; background:transparent; color:var(--ink-faint); cursor:pointer;
    font-size:13px; padding:6px 4px; border-radius:4px; flex-shrink:0; }
  .subrow .del:hover{ color:var(--red); background:var(--red-bg); }
  .verbox .addsub{ width:100%; border:1.5px dashed var(--line); background:transparent;
    color:var(--ink-soft); border-radius:6px; padding:9px; cursor:pointer; font-size:12.5px; }
  .verbox .addsub:hover{ border-color:var(--navy); color:var(--navy); }
  .verbox .noneyet{ font-size:12.5px; color:var(--ink-faint); font-style:italic; margin-bottom:9px; }

  .validate{ background:var(--amber-bg); border:1px solid #EBD6B4; border-radius:7px;
    padding:12px 14px; margin-bottom:18px; font-size:13px; color:#7A4C0E; line-height:1.5; }
  .validate ul{ margin:7px 0 0 17px; }
  .validate li{ margin-bottom:3px; }

  /* ---------- RUNNER ---------- */
  .step-meta{ display:flex; align-items:baseline; gap:13px; margin-bottom:6px; flex-wrap:wrap; }
  .step-counter{ font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase;
    color:var(--ink-faint); }
  .office-tag{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.6px;
    padding:3px 9px; border-radius:10px; color:#fff; }
  .office-tag.back{ background:#12405B; }
  .office-tag.front{ background:#2A9D8F; }
  .step-title{ font-family:var(--mono); font-weight:700; font-size:clamp(21px,3.2vw,29px);
    line-height:1.2; letter-spacing:-0.5px; margin-bottom:23px; }
  .step-title .num{ color:var(--ink-faint); margin-right:10px; }

  .versions{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:25px; }
  .vcard{ background:var(--card); border:1.5px solid var(--line); border-radius:8px; padding:16px 18px; }
  .vcard .vlabel{ font-family:var(--mono); font-size:11px; font-weight:700; width:24px; height:24px;
    border-radius:5px; background:var(--bg); color:var(--ink-soft); display:grid; place-items:center;
    margin-bottom:12px; }
  .vcard ul{ list-style:none; }
  .vcard li{ font-size:13.5px; line-height:1.55; padding-left:20px; position:relative; margin-bottom:9px; }
  .vcard li:last-child{ margin-bottom:0; }
  .vcard li::before{ content:attr(data-ref); position:absolute; left:0; top:1px;
    font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--ink-faint); }
  .vcard .empty-note{ font-size:13.5px; color:var(--ink-soft); font-style:italic; line-height:1.55; }

  .doc-card{ background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:18px 20px; margin-bottom:25px; }
  .doc-card ul{ list-style:none; }
  .doc-card li{ font-size:14.5px; line-height:1.6; padding-left:22px; position:relative; margin-bottom:10px; }
  .doc-card li:last-child{ margin-bottom:0; }
  .doc-card li::before{ content:attr(data-ref); position:absolute; left:0; top:1px;
    font-family:var(--mono); font-size:11px; font-weight:600; color:var(--teal); }
  .agree-note{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px;
    color:var(--teal); margin-bottom:8px; }

  .answers{ display:grid; gap:10px; margin-bottom:8px; }
  .ans{ display:flex; align-items:center; gap:14px; background:var(--card);
    border:1.5px solid var(--line); border-radius:8px; padding:15px 18px; cursor:pointer;
    text-align:left; width:100%; transition:border-color .12s, background .12s; }
  .ans:hover{ border-color:var(--ink-faint); }
  .ans:focus-visible{ outline:2px solid var(--navy); outline-offset:2px; }
  .ans .key{ font-family:var(--mono); font-size:11px; font-weight:700; width:22px; height:22px;
    border-radius:4px; background:var(--bg); color:var(--ink-soft); display:grid; place-items:center; flex-shrink:0; }
  .ans .txt{flex:1;}
  .ans .txt strong{ display:block; font-size:15px; font-weight:600; margin-bottom:2px; }
  .ans .txt span{ font-size:12.5px; color:var(--ink-soft); line-height:1.45; }
  .ans.sel{ border-color:var(--navy); background:#E6ECF2; }
  .ans.sel .key{ background:var(--navy); color:#fff; }

  /* mix builder */
  .mixpick{ padding-top:16px; }
  .mixpick-lead{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin-bottom:14px; }
  .mixpick-lead b{ color:var(--ink); font-weight:600; }
  .mixerr{ margin-top:12px; font-size:12.5px; color:var(--red); background:var(--red-bg);
    border:1px solid #E4C4BF; border-radius:6px; padding:8px 11px; }
  .dnd{ display:grid; grid-template-columns:1fr 1.15fr; gap:14px; align-items:start; }
  .pool-wrap{ display:grid; gap:10px; }
  .pool,.seq{ background:var(--card); border:1.5px solid var(--line); border-radius:8px; padding:13px 14px; }
  .pool h6,.seq h6{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.7px;
    color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .pool .plabel{ font-family:var(--mono); font-size:11px; font-weight:700; width:21px; height:21px;
    border-radius:5px; background:var(--bg); color:var(--ink-soft); display:grid; place-items:center; }
  .seq{ border-color:var(--navy); min-height:180px; }
  .seq.drag-over{ background:#EDF2F7; }
  .seq h6{ color:var(--navy); }
  .chip{ display:flex; gap:9px; align-items:flex-start; background:var(--bg); border:1px solid var(--line);
    border-radius:6px; padding:9px 10px; margin-bottom:6px; cursor:grab; font-size:12.5px; line-height:1.45; }
  .chip:last-child{margin-bottom:0;}
  .chip:hover{ border-color:var(--ink-faint); }
  .chip.dragging{ opacity:0.4; }
  .chip .grip{ font-family:var(--mono); color:var(--ink-faint); font-size:12px; margin-top:2px;
    flex-shrink:0; letter-spacing:-1px; }
  .chip .cref{ font-family:var(--mono); font-size:10px; font-weight:700; padding:2px 5px; border-radius:3px;
    flex-shrink:0; margin-top:1px; background:#DCE4E8; color:var(--ink-soft); }
  .chip .ctext{flex:1;}
  .chip .drop-x,.chip .add-plus{ border:none; background:transparent; color:var(--ink-faint);
    cursor:pointer; font-size:13px; padding:2px 4px; border-radius:3px; flex-shrink:0; }
  .chip .drop-x:hover{ color:var(--red); background:var(--red-bg); }
  .chip .add-plus:hover{ color:var(--navy); background:#E6ECF2; }
  .chip.placed{ opacity:0.32; cursor:default; }
  .chip.placed .add-plus{ visibility:hidden; }
  .seq .chip{ background:#fff; border-color:#C3D2DC; }
  .seq .chip .cref{ background:#E6ECF2; color:var(--navy); }
  .seq .chip .ord{ font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--navy);
    background:#E6ECF2; width:19px; height:19px; border-radius:50%; display:grid; place-items:center;
    flex-shrink:0; margin-top:1px; }
  .seq .chip.custom{ border-color:var(--violet); background:#FAF8FE; }
  .seq .chip.custom .cref,.seq .chip.custom .ord{ background:var(--violet-bg); color:var(--violet); }
  .seq-empty{ font-size:12.5px; color:var(--ink-faint); font-style:italic; border:1.5px dashed var(--line);
    border-radius:6px; padding:22px 14px; text-align:center; }
  .pool .none{ font-size:12.5px; color:var(--ink-faint); font-style:italic; }
  .mixcount{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-top:10px; text-align:right; }
  .drop-line{ height:2px; background:var(--navy); border-radius:2px; margin:3px 0; }
  .addcustom{ margin-top:10px; padding-top:12px; border-top:1px dashed var(--line); }
  .addcustom label{ display:block; font-family:var(--mono); font-size:10px; text-transform:uppercase;
    letter-spacing:0.7px; color:var(--violet); margin-bottom:8px; }
  .addcustom .r{ display:flex; gap:7px; }
  .addcustom input{ flex:1; font-size:13px; border:1.5px solid var(--line); border-radius:6px;
    padding:9px 11px; min-width:0; }
  .addcustom input:focus{ outline:2px solid var(--violet); border-color:var(--violet); }
  .addcustom button{ font-family:var(--mono); font-size:11px; background:var(--violet); color:#fff;
    border:none; padding:9px 15px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .addcustom .hintline{ font-size:11.5px; color:var(--ink-faint); margin-top:7px; }

  .followup{ padding-top:14px; }
  .followup label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:7px; }
  .followup textarea{ width:100%; min-height:66px; resize:vertical; font-size:14px; line-height:1.5;
    border:1.5px solid var(--line); border-radius:7px; padding:11px 12px; }
  .followup textarea:focus{ outline:2px solid var(--navy); border-color:var(--navy); }

  .nav{ display:flex; gap:10px; align-items:center; margin-top:25px; padding-top:20px;
    border-top:1px solid var(--line-soft); }

  /* summary */
  .tally{ display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:20px 0 24px; }
  .tally div{ background:var(--card); padding:14px 16px; }
  .tally .n{ font-family:var(--mono); font-weight:700; font-size:22px; }
  .tally .l{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px;
    margin-top:4px; line-height:1.35; }
  .sum-row{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px;
    margin-bottom:9px; display:flex; gap:12px; align-items:flex-start; }
  .sum-row .badge{ font-family:var(--mono); font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.4px; padding:5px 9px; border-radius:4px; white-space:nowrap; max-width:118px;
    text-align:center; line-height:1.3; }
  .badge.aligned{ background:var(--teal-bg); color:var(--teal); }
  .badge.risk{ background:var(--red-bg); color:var(--red); }
  .badge.stale{ background:var(--amber-bg); color:var(--amber); }
  .badge.emergent{ background:var(--violet-bg); color:var(--violet); }
  .badge.none{ background:#EEF1F2; color:var(--ink-faint); }
  .badge.sequence{ background:var(--sequence-bg); color:var(--sequence); }
  .sum-row .body{flex:1;}
  .sum-row .name{ font-weight:600; font-size:14px; margin-bottom:3px; }
  .sum-row .name .id{ font-family:var(--mono); color:var(--ink-faint); margin-right:7px; font-size:12.5px; }
  .sum-row .note{ font-size:13px; color:var(--ink-soft); line-height:1.5; }
  .sum-row .note em{ color:var(--ink-faint); }
  .sum-row .action{ font-size:12.5px; margin-top:5px; line-height:1.45; padding-left:11px;
    border-left:2px solid var(--line); }

  /* ---------- IMPORT REFERENCE ---------- */
  .colref{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px}
  .colref table{width:100%;border-collapse:collapse}
  .colref th{background:#F5F8F9;border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;
    font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft)}
  .colref td{padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px;vertical-align:top}

/* ============================================================
   ANSWER SETS + CLASSIFICATION
   ============================================================ */
const ANS_DIFFER = [
  {val:"a",    key:"1", title:"A",                     sub:"What we do looks like version A."},
  {val:"b",    key:"2", title:"B",                     sub:"What we do looks like version B."},
  {val:"mix",  key:"3", title:"A mix of both",         sub:"Build the actual sequence from both versions."},
  {val:"skip", key:"4", title:"We don't do this step", sub:"Skipped entirely, or handled by another team."}
];
const ANS_AGREE = [
  {val:"same",   key:"1", title:"Yes — that's what we do", sub:"Practice matches what's written."},
  {val:"partial",key:"2", title:"Partly — we do less",     sub:"Some of this doesn't happen in practice."},
  {val:"extra",  key:"3", title:"We do more than this",    sub:"Extra work happens that isn't written down."},
  {val:"skip",   key:"4", title:"We don't do this step",   sub:"Skipped entirely, or handled by another team."}
];
const FOLLOWUP = {
  a:"Anything you do differently from version A? One line is fine.",
  b:"Anything you do differently from version B? One line is fine.",
  mix:"Anything else worth noting about how this runs? (Optional)",
  skip:"In one line — why is it skipped, or who does it instead?",
  same:"Anything worth noting? (Optional)",
  partial:"In one line — which parts don't happen?",
  extra:"In one line — what extra work happens here?"
};
const VERDICT_ACTION = {
  aligned:"No action.",
  risk:"Escalate to process owner — local doc conflicts with global.",
  stale:"Update the local ops sheet to match global.",
  emergent:"Assess: formalise this practice, or correct it back to SOP.",
  sequence:"Review the documented order — the work happens, but in a different sequence."
};
const VLABEL = {aligned:"Aligned", risk:"Compliance risk", stale:"Local doc stale",
                emergent:"New practice", sequence:"Different order", none:"No answer"};

/* A step the reviewer never answered is missing data, not a finding.
   Keeping it distinct from "we don't do this step" — which IS a finding —
   stops absent responses being read as deviations. */
const VERDICT_ACTION_NONE = "No answer recorded — follow up with the reviewer before drawing conclusions.";

function isLocalOnly(step){ return (step.global||[]).length===0 && (step.local||[]).length>0; }

function classify(step, val, picks, assign, responses){
  if(!val) return null;
  // global SOP assigns this step to the FRONT office: doing it is a role
  // deviation — only "we don't do this step" conforms
  if(step.office==='front'){
    return val==='skip' ? 'aligned' : 'risk';
  }
  if(val==="skip") return isLocalOnly(step) ? "emergent" : "risk";
  if(step.agree){
    if(val==="same") return "aligned";
    if(val==="partial") return "risk";
    if(val==="extra") return "emergent";
    return null;
  }
  const aIsLocal = ((assign||SESS.assign||{})[step.id])==='local';
  const picked = val==="a" ? (aIsLocal?"local":"global")
               : val==="b" ? (aIsLocal?"global":"local") : val;
  // Picking a card that has no content means "we do none of this" — not that
  // practice follows a document that says nothing. Treat it as a skip.
  if((picked==="global" || picked==="local") && !(step[picked]||[]).length){
    return isLocalOnly(step) ? "emergent" : "risk";
  }
  if(picked==="global") return "stale";
  if(picked==="local")  return isLocalOnly(step) ? "emergent" : "risk";
  if(picked==="mix"){
    const r = resolvePicks(step, picks, assign, responses);
    if(r){
      const gTotal = (step.global||[]).length;
      if(gTotal>0 && r.global.length===gTotal){
        if(r.local.length || r.custom.length) return "emergent";
        // same content in a different order is still a deviation
        const pos = r.global.map(ref => (step.global||[]).findIndex(d=>d.ref===ref));
        if(pos.every((p,i)=> i===0 || pos[i-1] <= p)) return "stale";
        return "sequence";
      }
    }
    return "risk";
  }
  return null;
}

function aIsFor(step){
  if(!SESS.assign[step.id]){
    SESS.assign[step.id] = Math.random() < 0.5 ? 'local' : 'global';
    saveSession();
  }
  return SESS.assign[step.id];
}

async function saveIndex(){ try{ await sSet('proc:index', DB.index); }catch(e){ saveFailed(e.message); } }
async function saveProc(){
  if(!PROC) return;
  try{
    PROC.updated = new Date().toISOString();
    await sSet('proc:'+PROC.id, PROC);
    const row = DB.index.find(r=>r.id===PROC.id);
    if(row){ row.name = PROC.name; row.updated = PROC.updated; row.steps = PROC.steps.length; }
    await saveIndex();
    flagSaved();
  }catch(e){ saveFailed(e.message); }
}
async function saveSession(){
  if(!PROC) return;
  try{ await sSet('sess:'+PROC.id, SESS); flagSaved(); }
  catch(e){ saveFailed(e.message); }
}

async function openProc(id){
  PROC = await sGet('proc:'+id, null);
  SESS = await sGet('sess:'+id, {responses:{}, assign:{}});
  if(!SESS.responses) SESS.responses = {};
  if(!SESS.assign) SESS.assign = {};

/* Hand-rolled because Excel exports quote fields containing commas,
   quotes and newlines — split(',') corrupts real SOP text. */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');           // strip Excel BOM
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i], nx = text[i+1];
    if(q){
      if(ch === '"' && nx === '"'){ cell += '"'; i++; }
      else if(ch === '"'){ q = false; }
      else cell += ch;
    } else {
      if(ch === '"') q = true;
      else if(ch === ','){ row.push(cell); cell=''; }
      else if(ch === '\r'){ /* skip */ }
      else if(ch === '\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell += ch;
    }
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function csvToProcess(text){
  const rows = parseCSV(text);
  if(rows.length < 2) throw new Error('File appears to be empty — expected a header row plus at least one data row.');

  const head = rows[0].map(h => h.trim().toLowerCase());
  const missing = ['process_name','step_no','version','sub_text'].filter(c => !head.includes(c));
  if(missing.length) throw new Error('Missing required column(s): ' + missing.join(', '));

  const col = n => head.indexOf(n);
  const get = (r, n) => { const i = col(n); return i < 0 ? '' : (r[i]||'').trim(); };

  const body = rows.slice(1);
  const pname = body.map(r=>get(r,'process_name')).find(v=>v);
  if(!pname) throw new Error('No process_name value found in any row.');

  const proc = {
    id: uid('proc'),
    name: pname,
    domain:      body.map(r=>get(r,'domain')).find(v=>v) || '',
    globalLabel: body.map(r=>get(r,'global_label')).find(v=>v) || 'Global SOP',
    localLabel:  body.map(r=>get(r,'local_label')).find(v=>v)  || 'Local Ops Sheet',
    steps: [], updated: new Date().toISOString()
  };

  const order = [];               // preserves first-appearance order of steps
  const byNo = {};
  const warnings = [];

  body.forEach((r, i) => {
    const stepNo = get(r,'step_no');
    if(!stepNo){ warnings.push(`Row ${i+2}: no step_no — skipped.`); return; }

    if(!byNo[stepNo]){
      byNo[stepNo] = { id:stepNo, name:'', office:'back', agree:false, local:[], global:[], note:'' };
      order.push(stepNo);
    }
    const st = byNo[stepNo];
    if(get(r,'step_name')) st.name = get(r,'step_name');
    const off = get(r,'office').toLowerCase();
    if(off === 'front' || off === 'back') st.office = off;
    if(['true','y','yes','1'].includes(get(r,'same_in_both').toLowerCase())) st.agree = true;
    if(get(r,'step_note')) st.note = get(r,'step_note');

    const ver = get(r,'version').toLowerCase();
    const txt = get(r,'sub_text');
    if(!txt) return;                                  // header-ish or blank content row
    if(ver !== 'global' && ver !== 'local'){
      warnings.push(`Row ${i+2}: version "${get(r,'version')}" not recognised — expected global or local. Skipped.`);
      return;
    }
    const ref = get(r,'sub_ref') || String.fromCharCode(97 + st[ver].length);
    st[ver].push({ ref, text: txt });
  });

  proc.steps = order.map(n => byNo[n]);
  proc.steps.forEach(s=>{
    if(!s.name) warnings.push(`Step "${s.id}" has no step_name.`);
    if(!s.global.length && !s.local.length) warnings.push(`Step "${s.id}" has no content in either version.`);
  });
  if(!proc.steps.length) throw new Error('No usable steps found.');
  return { proc, warnings };
}

        <textarea class="fld" id="sheetPaste" style="min-height:110px; font-family:var(--mono); font-size:12px" placeholder="Paste rows from Excel or a CSV — with or without the header row.&#10;process_name,domain,global_label,local_label,step_no,step_name,office,same_in_both,version,sub_ref,sub_text,step_note&#10;Booking Order,…"></textarea>
        <div class="row" style="margin-top:6px">
          <button class="btn sm primary" onclick="replaceSheetFromPaste()">Load into sheet</button>
          <button class="btn sm" onclick="appendSheetFromPaste()">Append below</button>
          <span class="merr" id="sheetPasteErr" style="color:var(--red); font-size:12px"></span>
        </div>
      </div>
      <div class="exscroll">
        <table class="extab">
          <thead><tr>${IMPORT_COLS.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody id="extabBody">${sheetRowsHTML()}</tbody>
        </table>
      </div>
      <div class="exnote">
        <b>Reading the example:</b>
        <ul>
          <li>Step <b>1.0</b> spans six rows — three for each version. The step repeats; only <code>version</code>, <code>sub_ref</code> and <code>sub_text</code> change.</li>
          <li>Blank cells are fine. Once <code>process_name</code>, <code>domain</code> and the label columns appear on the first row, later rows can leave them empty.</li>
          <li>Step <b>2.0</b> has <code>same_in_both = TRUE</code>, so only the global rows are needed — the local version is treated as identical.</li>
          <li>Step <b>4.0</b> has <i>only</i> local rows and step <b>7.0</b> has <i>only</i> global rows. That's deliberate: a version saying nothing about a step is real data, not a mistake.</li>
          <li>Row order sets the display order of both steps and sub-steps.</li>
        </ul>
      </div>
    </div>

    <div class="sectlabel label" style="margin-top:26px">Columns
      <span class="hint">Four are required; the rest can be left blank.</span></div>
    <div class="colref">
      <table>
        <thead><tr><th>Column</th><th>Required</th><th>What it holds</th></tr></thead>
        <tbody>${COL_HELP.map(([n,req,d])=>`<tr>
          <td class="cn">${n}</td>
          <td class="rq"><span class="${req?'req':'opt'}">${req?'Required':'Optional'}</span></td>
          <td class="dsc">${d}</td></tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="field">
      <label>Or paste CSV rows here</label>
      <textarea class="fld" id="csvText" style="min-height:150px; font-family:var(--mono); font-size:12px"
        placeholder="process_name,domain,global_label,local_label,step_no,step_name,office,same_in_both,version,sub_ref,sub_text,step_note&#10;Booking Order,…"></textarea>
    </div>
    <div class="row"><button class="btn primary" onclick="parsePasted()">Parse rows</button>
      <span class="merr" id="impErr" style="color:var(--red); font-size:12.5px"></span></div>

    ${preview}`;

  const f = document.getElementById('csvFile');
  if(f) f.addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => { document.getElementById('csvText').value = rd.result; parsePasted(); };
    rd.readAsText(file);
  });

  const tb = document.getElementById('extabBody');
  if(tb){
    // typing in a cell
    tb.addEventListener('input', e=>{
      const td = e.target.closest('td[contenteditable]');
      if(!td) return;
      const ri=+td.dataset.r, ci=+td.dataset.c, v=td.textContent;
      if(!importGrid[ri]) return;
      importGrid[ri][ci] = v;
      td.className = (v===''?'blank ':'') + (HL_COLS.includes(IMPORT_COLS[ci])?'hl':'');
      td.title = v;
    });
    // dropdown cells
    tb.addEventListener('change', e=>{
      const sel = e.target.closest('select.cellpick');
      if(!sel) return;
      const ri=+sel.dataset.r, ci=+sel.dataset.c;
      if(!importGrid[ri]) return;
      importGrid[ri][ci] = sel.value;
      sel.closest('td').className = (sel.value===''?'blank ':'') + (HL_COLS.includes(IMPORT_COLS[ci])?'hl':'');
    });
    // Excel-style paste into the grid: multi-row clipboard fills down/right from the cell
    tb.addEventListener('paste', e=>{
      const text = e.clipboardData.getData('text');
      if(!text || (!text.includes('\n') && !text.includes('\t'))) return;
      e.preventDefault();
      const td = e.target.closest('td[contenteditable]');
      if(!td) return;
      const ri=+td.dataset.r, ci=+td.dataset.c;
      const lines = text.replace(/\r/g,'').split('\n');
      while(lines.length && lines[lines.length-1]==='') lines.pop();
      lines.forEach((line,di)=>{
        const cells = line.includes('\t') ? line.split('\t') : line.split(',');
        cells.forEach((cv,dj)=>{
          const r=ri+di, c=ci+dj;
          if(!importGrid[r]) importGrid[r]=Array(IMPORT_COLS.length).fill('');
          importGrid[r][c] = cv;
        });
      });
      tb.innerHTML = sheetRowsHTML();
    });
  }
}

/* ---------- editable sheet ---------- */
function sheetRowsHTML(){
  return importGrid.map((r,ri)=>`<tr>${r.map((v,ci)=>{
    const col = IMPORT_COLS[ci];
    const cls = (v===''?'blank ':'') + (HL_COLS.includes(col)?'hl':'');
    // constrained columns get dropdowns instead of free text
    if(col==='office' || col==='version' || col==='same_in_both'){
      const opts = col==='office' ? ['','back','front']
                 : col==='version' ? ['','global','local']
                 : ['','TRUE','FALSE'];
      const norm = col==='same_in_both'
        ? ({TRUE:'TRUE',FALSE:'FALSE',Y:'TRUE',YES:'TRUE',1:'TRUE',N:'FALSE',NO:'FALSE',0:'FALSE'})[String(v).toUpperCase()] || ''
        : v;
      return `<td class="${cls.trim()}"><select class="cellpick" data-r="${ri}" data-c="${ci}">${opts.map(o=>`<option value="${o}" ${o===norm?'selected':''}>${o||'—'}</option>`).join('')}</select></td>`;
    }
    return `<td class="${cls.trim()}" contenteditable="true" data-r="${ri}" data-c="${ci}" title="${esc(v)}">${v===''?'&nbsp;':esc(v)}</td>`;
  }).join('')}</tr>`).join('');
}
function loadSheetExample(){ importGrid = EXAMPLE_ROWS.map(r=>[...r]); render(); }
function clearSheet(){ importGrid = [Array(IMPORT_COLS.length).fill('')]; render(); }
function addSheetRow(){ importGrid.push(Array(IMPORT_COLS.length).fill('')); render(); }
function addSheetRows(n){ for(let i=0;i<n;i++) importGrid.push(Array(IMPORT_COLS.length).fill('')); render(); }
function toggleSheetPaste(){
  const w = document.getElementById('sheetPasteWrap');
  if(w) w.style.display = w.style.display==='none' ? '' : 'none';
}
function sheetPasteRows(){
  const raw = document.getElementById('sheetPaste').value;
  let rows = parseCSV(raw);
  if(rows.length<=1 && raw.includes('\t')){   // Excel copies are tab-separated
    rows = raw.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='').map(l=>l.split('\t'));
  }
  if(rows.length && rows[0][0] && rows[0][0].trim().toLowerCase()==='process_name') rows = rows.slice(1);
  return rows;
}
function replaceSheetFromPaste(){
  const err = document.getElementById('sheetPasteErr');
  try{
    const rows = sheetPasteRows();
    if(!rows.length) throw new Error('Nothing to load — paste some rows first.');
    importGrid = rows.map(r=>{ const out=Array(IMPORT_COLS.length).fill(''); r.forEach((c,i)=>{ if(i<out.length) out[i]=String(c); }); return out; });
    render(); err.textContent='';
  }catch(e){ err.textContent = e.message; }
}
function appendSheetFromPaste(){
  const err = document.getElementById('sheetPasteErr');
  try{
    const rows = sheetPasteRows();
    if(!rows.length) throw new Error('Nothing to append.');
    rows.forEach(r=>{ const out=Array(IMPORT_COLS.length).fill(''); r.forEach((c,i)=>{ if(i<out.length) out[i]=String(c); }); importGrid.push(out); });
    render(); err.textContent='';
  }catch(e){ err.textContent = e.message; }
}
function subListHTML(subs){
  if(!subs || !subs.length) return '<p class="subempty">Nothing in this version.</p>';
  return `<ul class="sublist">${subs.map(d=>`<li><b>${esc(d.ref||'·')}</b> ${esc(d.text)}</li>`).join('')}</ul>`;
}
function toggleImportStep(i){
  if(importPreviewOpen.has(i)) importPreviewOpen.delete(i); else importPreviewOpen.add(i);
  render();
}
function expandAllImportSteps(open){
  importPreviewOpen = open && pendingImport
    ? new Set(Array.from({length: pendingImport.proc.steps.length}, (_,i)=>i))
    : new Set();
  render();
}

function importFromSheet(){
  const q = v => /[",\n]/.test(v) ? '"'+String(v).replace(/"/g,'""')+'"' : v;
  try{
    const csv = importGrid.map(r=>r.map(q).join(',')).join('\n');
    pendingImport = csvToProcess(IMPORT_COLS.join(',') + '\n' + csv);
    importPreviewOpen = new Set();
    render();
  }catch(e){
    const el = document.getElementById('sheetPasteErr');
    if(el) el.textContent = e.message; else saveFailed(e.message);
  }
}

function parsePasted(){
  const t = (document.getElementById('csvText').value||'').trim();
  const err = document.getElementById('impErr');
  err.textContent = '';
  if(!t){ err.textContent = 'Nothing to parse yet.'; return; }
  try{
    pendingImport = csvToProcess(t);
    importPreviewOpen = new Set();
    render();
  }catch(e){
    pendingImport = null;
    err.textContent = e.message;
  }
}

async function commitImport(){
  if(!pendingImport) return;
  const p = pendingImport.proc;
  await sSet('proc:'+p.id, p);
  DB.index.push({id:p.id, name:p.name, domain:p.domain, steps:p.steps.length,
                 updated:p.updated, status:'ready'});
  await saveIndex();
  pendingImport = null;
  PROC = p; SESS = {responses:{}, assign:{}};
  nav({v:'admin'});
}

function downloadTemplate(){
  const q = v => `"${String(v).replace(/"/g,'""')}"`;

/* Region is captured before the first step and locked for the session.
   It's the axis every cross-team comparison hangs off — a session
   without it can't be told apart from any other team's run. */
async function captureRegion(){
  const r = await askRegion();
  if(!r) return false;
  SESS.region = r.region;
  SESS.name = r.name;
  SESS.startedAt = new Date().toISOString();
  await saveSession();
  const row = DB.index.find(x=>x.id===PROC.id);
  if(row){ row.status='inprog'; await saveIndex(); }
  return true;
}
