function validateProc(p){
  const out = [];
  if(!p.steps.length) out.push('No steps added yet.');
  p.steps.forEach((s,i)=>{
    const label = s.id || s.name || ('step '+(i+1));
    if(!s.name) out.push(`"${label}" has no name.`);
    if(!(s.global||[]).length && !(s.local||[]).length) out.push(`"${label}" has no content in either version.`);
    if(s.agree && !(s.global||[]).length) out.push(`"${label}" is marked as agreed but has no content.`);
  });
  return out;
}

function toggleStep(i){ view.openStep = (view.openStep===i? null : i); render(); }
function setProcField(k,v){ PROC[k]=v; saveProc(); if(k!=='name') return; render(); }
function setStep(i,k,v){ PROC.steps[i][k]=v; saveProc(); render(); }
function setSub(i,which,j,k,v){ PROC.steps[i][which][j][k]=v; saveProc(); }
function addSub(i,which){
  const arr = PROC.steps[i][which] = PROC.steps[i][which]||[];
  const next = String.fromCharCode(97 + arr.length);
  arr.push({ref:next, text:''});
  saveProc(); render();
}
function delSub(i,which,j){ PROC.steps[i][which].splice(j,1); saveProc(); render(); }
function addStep(){
  PROC.steps.push({ id:(PROC.steps.length+1)+'.0', name:'', office:'back', agree:false, local:[], global:[], note:'' });
  view.openStep = PROC.steps.length-1;
  saveProc(); render();
}
async function delStep(i){
  const ok = await askConfirm({
    title:'Delete this step?',
    body:'Any session answers recorded for it will be lost.',
    okText:'Delete step', danger:true
  });
  if(!ok) return;
  const sid = PROC.steps[i].id;
  PROC.steps.splice(i,1);
  delete SESS.responses[sid]; delete SESS.assign[sid];
  view.openStep = null;
  saveProc(); saveSession(); render();
}
function moveStep(i,d){
  const j=i+d; if(j<0||j>=PROC.steps.length) return;
  const [s]=PROC.steps.splice(i,1); PROC.steps.splice(j,0,s);
  view.openStep = j; saveProc(); render();
}
async function deleteProcess(){
  const ok = await askConfirm({
    title:'Delete this process?',
    body:`"${PROC.name}" and all its session answers will be removed. This cannot be undone.`,
    okText:'Delete process', danger:true
  });
  if(!ok) return;
  await sDel('proc:'+PROC.id); await sDel('sess:'+PROC.id);
  DB.index = DB.index.filter(r=>r.id!==PROC.id);
  await saveIndex();
  PROC=null; nav({v:'home'});
}

/* ---------- RUNNER ---------- */
function renderProgress(host){
  const pips = PROC.steps.map((s,i)=>{
    const a = SESS.responses[s.id] && SESS.responses[s.id].val ? 'answered':'';
    return `<div class="pip ${a} ${i===view.stepIdx?'current':''}" title="${esc(s.id)} ${esc(s.name)}" onclick="goTo(${i})"></div>`;
  }).join('');
  host.innerHTML = `<div class="progress-strip">${pips}
    <div class="pip ${view.stepIdx===PROC.steps.length?'current':''}" title="Summary" onclick="goTo(${PROC.steps.length})"></div>
  </div>`;
}
/* Cross-validation: a mix answer whose sequence is EXACTLY one card's
   full sub-step set isn't a mix — it's an A or a B answer in disguise.
   Returns 'a' | 'b' | null. */
function mixIsPlainCopy(step){
  const seq = (SESS.responses[step.id]||{}).picks || [];
  if(!seq.length || seq.some(k=>k.startsWith('c:'))) return null;   // customs = genuinely a mix
  const aIs = aIsFor(step)==='local' ? step.local : step.global;
  const bIs = aIsFor(step)==='local' ? step.global : step.local;
  const refs = seq.map(k=>k.split(':')[1]);
  // order-sensitive: a reordered sequence is a different practice, not a copy
  const sameOrdered = arr => arr.length===refs.length && arr.every((d,i)=> d.ref===refs[i]);
  if(aIs.length && sameOrdered(aIs)) return 'a';
  if(bIs.length && sameOrdered(bIs)) return 'b';
  return null;
}
const MIX_COPY_MSG = copy => `The sequence you built matches <b>Card ${copy.toUpperCase()}</b> exactly — pick <b>${copy.toUpperCase()}</b> instead if that's what you do, or adjust the mix so it reflects what actually happens.`;

function goTo(i){
  // a "mix" answer must be a real mix: non-empty, and not just a
  // verbatim copy of card A or card B
  const cur = PROC.steps[view.stepIdx];
  if(cur && i !== view.stepIdx){
    const r = SESS.responses[cur.id]||{};
    if(r.val==='mix'){
      const e = document.getElementById('mixErr');
      if(!(r.picks||[]).length){
        if(e) e.innerHTML = 'Add at least one step to <b>What we actually do</b> before continuing.';
        return;
      }
      const copy = mixIsPlainCopy(cur);
      if(copy){
        if(e) e.innerHTML = MIX_COPY_MSG(copy);
        return;
      }
    }
  }
  view.stepIdx = Math.max(0, Math.min(PROC.steps.length, i)); render(); window.scrollTo(0,0);
}

function listHTML(arr, emptyMsg){
  if(!arr || !arr.length) return `<p class="empty-note">${esc(emptyMsg)}</p>`;
  return `<ul>${arr.map(d=>`<li data-ref="${esc(d.ref)}">${esc(d.text)}</li>`).join('')}</ul>`;
}

function renderStep(host){
  const s = PROC.steps[view.stepIdx];
  const saved = SESS.responses[s.id] || {};

  let procHTML;
  if(s.agree){
    procHTML = `
      <div class="label">What the procedure says<span class="hint">Both documents describe this step the same way.</span></div>
      <div class="doc-card">
        <div class="agree-note">Both versions agree</div>
        ${listHTML(s.global, "Nothing documented.")}
      </div>`;
  } else {
    const aIs = aIsFor(s);
    const aData = aIs==='local' ? s.local : s.global;
    const bData = aIs==='local' ? s.global : s.local;
    const em = "This version has nothing written for this step.";
    procHTML = `
      <div class="label">Two versions of this step exist<span class="hint">Read both, then pick the one closest to what you actually do. Which document each version came from stays hidden for the whole session.</span></div>
      <div class="versions">
        <div class="vcard"><span class="vlabel">A</span>${listHTML(aData, em)}</div>
        <div class="vcard"><span class="vlabel">B</span>${listHTML(bData, em)}</div>
      </div>`;
  }

  const set = s.agree ? ANS_AGREE : ANS_DIFFER;
  const answersHTML = set.map(a=>`
    <button class="ans ${saved.val===a.val?'sel':''}" onclick="pick('${a.val}')">
      <span class="key">${a.key}</span>
      <span class="txt"><strong>${a.title}</strong><span>${a.sub}</span></span>
    </button>`).join('');

  const mixEmpty = saved.val==='mix' && !(saved.picks||[]).length;
  const mixCopy = (!mixEmpty && saved.val==='mix') ? mixIsPlainCopy(s) : null;
  const mixHTML = (!s.agree && saved.val==='mix')
    ? `<div class="mixpick">
         <p class="mixpick-lead">Drag the steps you actually do into <b>What we actually do</b>, in the order you do them. Pull from either version — or both. Anything you don't do, leave behind.</p>
         <div id="mixHost"></div>
         <div class="mixerr" id="mixErr">${mixEmpty?'Add at least one step to <b>What we actually do</b> before continuing.':mixCopy?MIX_COPY_MSG(mixCopy):''}</div>
       </div>` : '';

  host.innerHTML = `
    <div class="step-meta">
      <span class="step-counter">Step ${view.stepIdx+1} of ${PROC.steps.length}</span>
    </div>
    <h1 class="step-title"><span class="num">${esc(s.id)}</span>${esc(s.name)}</h1>
    ${procHTML}
    <div class="label">${s.agree?'Does this match what actually happens?':'Which is closer to what actually happens?'}</div>
    <div class="answers">${answersHTML}</div>
    ${mixHTML}
    ${saved.val ? `<div class="followup">
      <label>${esc(FOLLOWUP[saved.val]||'')}</label>
      <textarea id="fuText" placeholder="Short answer is fine.">${esc(saved.note||'')}</textarea>
    </div>` : ''}
    <div class="nav">
      <button class="btn" onclick="goTo(${view.stepIdx-1})" ${view.stepIdx===0?'disabled':''}>← Back</button>
      <span class="spacer"></span>
      <button class="btn primary" onclick="goTo(${view.stepIdx+1})">${view.stepIdx===PROC.steps.length-1?'Finish → Summary':'Next step →'}</button>
    </div>`;

  const ta = document.getElementById('fuText');
  if(ta) ta.addEventListener('input', ()=>{
    const c = SESS.responses[s.id] || {};
    c.note = ta.value; SESS.responses[s.id] = c;
    flagSaved(); saveSession();
  });

  if(!s.agree && saved.val==='mix') renderMix(s);
}

function pick(val){
  const s = PROC.steps[view.stepIdx];
  const c = SESS.responses[s.id] || {};
  if(c.val!==val && val!=='mix'){ delete c.picks; delete c.customs; }
  c.val = val; SESS.responses[s.id] = c;
  saveSession(); render();
  if(val!=='mix') setTimeout(()=>{ const t=document.getElementById('fuText'); if(t) t.focus(); },120);
}

/* ---------- mix builder ---------- */
function subStepText(step, key){
  const [side, ref] = key.split(':');
  if(side==='c'){
    const c = SESS.responses[step.id]||{};
    return (c.customs && c.customs[ref]) ? c.customs[ref] : '';
  }
  const aIsLocal = aIsFor(step)==='local';
  const isLocal = (side==='a') ? aIsLocal : !aIsLocal;
  const arr = isLocal ? step.local : step.global;
  const f = (arr||[]).find(d=>d.ref===ref);
  return f ? f.text : '';
}

function renderMix(step){
  const host = document.getElementById('mixHost');
  if(!host) return;
  const cur = SESS.responses[step.id]||{};
  const seq = cur.picks || [];
  const mAIs = aIsFor(step);
  const aData = mAIs==='local' ? step.local : step.global;
  const bData = mAIs==='local' ? step.global : step.local;

  const chip = (d, side)=>{
    const key = side+':'+d.ref, placed = seq.includes(key);
    return `<div class="chip ${placed?'placed':''}" draggable="${placed?'false':'true'}" data-key="${esc(key)}" data-from="pool">
      <span class="grip">⣿</span><span class="cref">${esc(d.ref)}</span>
      <span class="ctext">${esc(d.text)}</span>
      <button class="add-plus" data-add="${esc(key)}" title="Add">＋</button></div>`;
  };
  const pool = (data, side, L)=>`<div class="pool"><h6><span class="plabel">${L}</span> Version ${L}</h6>
    ${(data&&data.length)?data.map(d=>chip(d,side)).join(''):'<p class="none">Nothing written in this version.</p>'}</div>`;

  const seqHTML = seq.length ? seq.map((k,i)=>{
      const isC = k.split(':')[0]==='c';
      return `<div class="chip ${isC?'custom':''}" draggable="true" data-key="${esc(k)}" data-from="seq">
        <span class="ord">${i+1}</span><span class="cref">${isC?'NEW':esc(k.split(':')[1])}</span>
        <span class="ctext">${esc(subStepText(step,k))}</span>
        <button class="drop-x" data-remove="${esc(k)}" title="Remove">✕</button></div>`;
    }).join('') : `<div class="seq-empty">Drag steps here, or use ＋ — then drag to reorder.</div>`;

  host.innerHTML = `
    <div class="dnd">
      <div class="pool-wrap">${pool(aData,'a','A')}${pool(bData,'b','B')}</div>
      <div class="seq" id="seqZone">
        <h6>What we actually do — in order</h6>
        <div id="seqList">${seqHTML}</div>
        <div class="addcustom">
          <label>Something we do that's in neither version</label>
          <div class="r"><input type="text" id="customInput" placeholder="Describe the step in your own words…">
          <button id="customAdd">Add step</button></div>
          <p class="hintline">Added to the end — drag it into position afterwards.</p>
        </div>
      </div>
    </div>
    <div class="mixcount">${seq.length} step${seq.length===1?'':'s'} in sequence</div>`;
  bindMix(step);
}

function saveSeq(step, seq){
  const c = SESS.responses[step.id]||{};
  c.picks = seq; SESS.responses[step.id]=c;
  const me = document.getElementById('mixErr');
  if(me) me.textContent = '';
  flagSaved(); saveSession(); renderMix(step);
  // live cross-validation: the moment the sequence becomes an exact
  // copy of A or B, say so instead of waiting for the Next click
  const copy = seq.length ? mixIsPlainCopy(step) : null;
  if(copy && me) me.innerHTML = MIX_COPY_MSG(copy);
}

function bindMix(step){
  const cur = SESS.responses[step.id]||{};
  let seq = (cur.picks||[]).slice();
  const host=document.getElementById('mixHost'),
        zone=document.getElementById('seqZone'),
        list=document.getElementById('seqList');
  if(!host||!zone||!list) return;

  host.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    if(!seq.includes(b.dataset.add)){ seq.push(b.dataset.add); saveSeq(step,seq); }
  }));
  host.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const k=b.dataset.remove;
    seq=seq.filter(x=>x!==k);
    if(k.split(':')[0]==='c'){
      const c=SESS.responses[step.id]||{};
      if(c.customs) delete c.customs[k.split(':')[1]];
      SESS.responses[step.id]=c;
    }
    saveSeq(step,seq);
  }));

  const ci=document.getElementById('customInput'), cb=document.getElementById('customAdd');
  function addCustom(){
    const t=(ci.value||'').trim(); if(!t){ ci.focus(); return; }
    const c=SESS.responses[step.id]||{}; c.customs=c.customs||{};
    const id='c'+Date.now().toString(36).slice(-5);
    c.customs[id]=t; SESS.responses[step.id]=c;
    seq.push('c:'+id); ci.value='';
    saveSeq(step,seq);
    setTimeout(()=>{ const el=document.getElementById('customInput'); if(el) el.focus(); },60);
  }
  if(cb) cb.addEventListener('click',addCustom);
  if(ci) ci.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addCustom(); }});

  let dragKey=null, dragFrom=null;
  host.querySelectorAll('.chip[draggable="true"]').forEach(ch=>{
    ch.addEventListener('dragstart',e=>{
      dragKey=ch.dataset.key; dragFrom=ch.dataset.from;
      ch.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',dragKey);
    });
    ch.addEventListener('dragend',()=>{ ch.classList.remove('dragging'); clearLine(); });
  });
  function clearLine(){ list.querySelectorAll('.drop-line').forEach(l=>l.remove()); }
  function idxFor(y){
    const chips=Array.from(list.querySelectorAll('.chip:not(.dragging)'));
    for(let i=0;i<chips.length;i++){
      const r=chips[i].getBoundingClientRect();
      if(y < r.top+r.height/2) return i;
    }
    return chips.length;
  }
  zone.addEventListener('dragover',e=>{
    e.preventDefault(); e.dataTransfer.dropEffect='move';
    zone.classList.add('drag-over'); clearLine();
    const i=idxFor(e.clientY), chips=Array.from(list.querySelectorAll('.chip:not(.dragging)'));
    const line=document.createElement('div'); line.className='drop-line';
    if(i>=chips.length) list.appendChild(line); else list.insertBefore(line,chips[i]);
  });
  zone.addEventListener('dragleave',e=>{ if(!zone.contains(e.relatedTarget)){ zone.classList.remove('drag-over'); clearLine(); }});
  zone.addEventListener('drop',e=>{
    e.preventDefault(); zone.classList.remove('drag-over');
    const i=idxFor(e.clientY); clearLine();
    if(!dragKey) return;
    const w=seq.filter(x=>x!==dragKey);
    w.splice(Math.max(0,Math.min(w.length,i)),0,dragKey);
    seq=w; saveSeq(step,seq);
  });
  host.querySelectorAll('.pool').forEach(p=>{
    p.addEventListener('dragover',e=>{ if(dragFrom==='seq') e.preventDefault(); });
    p.addEventListener('drop',e=>{
      if(dragFrom!=='seq') return;
      e.preventDefault(); seq=seq.filter(x=>x!==dragKey); saveSeq(step,seq);
    });
  });
}

/* ---------- resolution + summary ---------- */
function resolvePicks(step, picks, assign, responses){
  if(!picks||!picks.length) return null;
  // optional assign/responses let the sessions record view classify a
  // stored session without touching the globals SESS/PROC
  const aIsLocal = ((assign||SESS.assign||{})[step.id])==='local';
  const resp = (responses||SESS.responses||{})[step.id]||{};
  const out={local:[],global:[],custom:[],order:[]};
  picks.forEach(k=>{
    const [side,ref]=k.split(':');
    if(side==='c'){
      out.custom.push((resp.customs&&resp.customs[ref])?resp.customs[ref]:'(untitled)');
      out.order.push('NEW'); return;
    }
    const isLocal = (side==='a')?aIsLocal:!aIsLocal;
    out[isLocal?'local':'global'].push(ref);
    out.order.push((isLocal?'L':'G')+ref);
  });
  return out;
}
function picksText(step,picks,assign,responses,labels){
  const r=resolvePicks(step,picks,assign,responses); if(!r) return '';
  const gl=(labels&&labels.globalLabel)?labels.globalLabel:PROC.globalLabel;
  const ll=(labels&&labels.localLabel)?labels.localLabel:PROC.localLabel;
  const p=[];
  if(r.local.length)  p.push(ll+': '+r.local.join(', '));
  if(r.global.length) p.push(gl+': '+r.global.join(', '));
  if(r.custom.length) p.push('In neither document: '+r.custom.join('; '));
  p.push('Order: '+r.order.join(' → '));
  return p.join('  ·  ');
}


function renderSummary(host){
  // mark the session complete in the DB once, when the run reaches the
  // summary — the analysis view only counts complete sessions
  if(SESS.id && !SESS.submitted){ SESS.submitted = true; dbCompleteSession(SESS.id).catch(e=>saveFailed(e.message)); }
  const counts={aligned:0,risk:0,stale:0,emergent:0,sequence:0,none:0};
  const data = PROC.steps.map(s=>{
    const r=SESS.responses[s.id]||{};
    const v=classify(s,r.val,r.picks)||'none';
    counts[v]++; return {s,r,v};
  });
  const rows = data.map(({s,r,v})=>{
    const note = r.note&&r.note.trim()?esc(r.note.trim()):'<em>No detail captured.</em>';
    const pk = picksText(s,r.picks);
    return `<div class="sum-row">
      <span class="badge ${v}">${VLABEL[v]}</span>
      <div class="body">
        <div class="name"><span class="id">${esc(s.id)}</span>${esc(s.name)}</div>
        <div class="note">${note}</div>
        ${pk?`<div class="action" style="border-left-color:var(--violet)"><b style="font-family:var(--mono);font-size:11px">Steps actually performed</b><br>${esc(pk)}</div>`:''}
        <div class="action"${v==='none'?' style="border-left-color:var(--amber);color:var(--amber)"':''}>${esc(v!=='none'?VERDICT_ACTION[v]:VERDICT_ACTION_NONE)}</div>
        ${s.note?`<div class="action" style="border-left-color:var(--ink-faint);color:var(--ink-soft)">${esc(s.note)}</div>`:''}
      </div></div>`;
  }).join('');

  host.innerHTML = `
    <h2 class="page">Session summary</h2>
    <p class="lede">${SESS.region?`<b>${esc(SESS.region)}${SESS.name?' · '+esc(SESS.name):''}</b> — e`:'E'}ach step classified by how actual practice lines up against both documents. Export before closing, then work the risk and stale items with the process owner.</p>
    ${counts.none?`<div class="validate"><b>Incomplete session.</b> ${counts.none} of ${PROC.steps.length} steps have no answer recorded. Those aren't deviations — they're gaps in the data. Treat the conformance figures as provisional until they're filled in.</div>`:''}
    <div class="tally">
      <div><div class="n" style="color:var(--teal)">${counts.aligned}</div><div class="l">Aligned</div></div>
      <div><div class="n" style="color:var(--red)">${counts.risk}</div><div class="l">Compliance risk</div></div>
      <div><div class="n" style="color:var(--amber)">${counts.stale}</div><div class="l">Local doc stale</div></div>
      <div><div class="n" style="color:var(--violet)">${counts.emergent}</div><div class="l">New practice</div></div>
      <div><div class="n" style="color:var(--sequence)">${counts.sequence}</div><div class="l">Different order</div></div>
      <div><div class="n" style="color:${counts.none?'var(--amber)':'var(--ink-faint)'}">${counts.none}</div><div class="l">No answer</div></div>
    </div>
    ${rows}
    <div class="nav">
      <button class="btn" onclick="goTo(${PROC.steps.length-1})">← Back to last step</button>
      <button class="btn" onclick="nav({v:'home'})">Library</button>
      <span class="save-hint" id="saveHint"></span>
      <span class="spacer"></span>
      <button class="btn" onclick="copyOut()">Copy as text</button>
      <button class="btn primary" onclick="downloadCSV()">Download CSV</button>
    </div>`;

  const row = DB.index.find(r=>r.id===PROC.id);
  if(row && counts.none < PROC.steps.length){ row.status = counts.none? 'inprog':'done'; saveIndex(); }
}

function buildRows(){
  return PROC.steps.map(s=>{
    const r=SESS.responses[s.id]||{};
    const v=classify(s,r.val,r.picks)||'none';
    return { id:s.id, name:s.name, office:s.office==='back'?'Back office':'Front office',
             outcome:VLABEL[v], action:v!=='none'?VERDICT_ACTION[v]:'',
             picks:picksText(s,r.picks), note:(r.note||'').trim() };
  });
}
function copyOut(){
  const t = `${PROC.name} — Process Review Session\nRegion: ${SESS.region||'—'}\nCompleted by: ${SESS.name||'—'}\nDate: ${new Date().toISOString().slice(0,10)}\n\n`
    + buildRows().map(r=>`${r.id}  ${r.name}  [${r.office}]\n  Outcome: ${r.outcome}\n  Action: ${r.action||'—'}\n  Steps performed: ${r.picks||'—'}\n  Note: ${r.note||'—'}`).join('\n\n');
  navigator.clipboard.writeText(t).then(()=>{
    const h=document.getElementById('saveHint'); if(h){h.textContent='Copied'; setTimeout(()=>h.textContent='',1800);}
  }).catch(()=>{ const h=document.getElementById('saveHint'); if(h) h.textContent='Copy failed — use CSV'; });
}
function downloadCSV(){
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const csv=['Process,Region,Completed by,Step,Name,Office,Outcome,Action,Steps performed,Note']
    .concat(buildRows().map(r=>[PROC.name,SESS.region||'',SESS.name||'',
            r.id,r.name,r.office,r.outcome,r.action,r.picks,r.note].map(q).join(',')))
    .join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=PROC.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+(SESS.region||'session').toLowerCase()+'-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

async function restartSession(){
  const ok = await askConfirm({
    title:'Restart this session?',
    body:'All answers for this process will be cleared.\n\nVersions A and B will be shuffled again, so a new group gets a different arrangement.',
    okText:'Restart', danger:true
  });
  if(!ok) return;
  SESS={responses:{},assign:{}};   // region cleared too — the next team enters their own
  await saveSession();
  const row=DB.index.find(r=>r.id===PROC.id); if(row){ row.status='ready'; await saveIndex(); }
  goTo(0);
}

/* keyboard */
document.addEventListener('keydown',e=>{
  if(view.v!=='run') return;
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  if(view.stepIdx>=PROC.steps.length) return;
  const set = PROC.steps[view.stepIdx].agree ? ANS_AGREE : ANS_DIFFER;
  const a = set.find(x=>x.key===e.key);
  if(a){ pick(a.val); return; }
  if(e.key==='ArrowRight') goTo(view.stepIdx+1);
  if(e.key==='ArrowLeft')  goTo(view.stepIdx-1);
});

/* ============================================================
   ANALYSIS — cross-region dashboard
   Reads the SQL views via supabase-client.js. Verdicts come from
   the same classification the reviewer saw on screen, so this
   view can't drift from the app.
   ============================================================ */

/* Glyphs are chosen to be readable without the key:
   ✓ matches global · ≠ follows the local doc · ⚠ local doc stale
   − parts skipped · ✕ step not done · ⇄ wrong office does it
   ⇅ reordered · + something added · · no response */
const DEV = {
  aligned:  {code:'✓',  label:'Matches global',
             hint:'Performed exactly as the global SOP describes.'},
  localdoc: {code:'≠',  label:'Followed the local doc',
             hint:'Follows the local sheet where it conflicts with global.'},
  stale:    {code:'⚠',  label:'Local doc stale — follows global',
             hint:'Practice matches the global SOP; the local sheet describes something else and should be updated.'},
  coverage: {code:'−',  label:'Parts of it skipped',
             hint:'Some required sub-steps of the global SOP are not performed.'},
  omitted:  {code:'✕',  label:'Step not done',
             hint:'The step is skipped entirely, or handled by another team.'},
  role:     {code:'⇄',  label:'Role deviation — doing this step',
             hint:'Global assigns this step to the front office; doing it here is a role deviation.'},
  sequence: {code:'⇅',  label:'Done in a different order',
             hint:'All required sub-steps happen, but not in the documented order.'},
  emergent: {code:'+',  label:'Extra step added',
             hint:'Work that appears in neither document.'},
  none:     {code:'·',  label:'No response',
             hint:'This region has not answered this step yet.'}
};

/* The app's verdict vocabulary (aligned / risk / stale / emergent / sequence)
   mapped onto the matrix glyph language. 'risk' is one glyph in the matrix
   but three different things — analysisCellType refines it per cell. */
const VERDICT_GLYPH = { aligned:'aligned', risk:'coverage', stale:'stale',
                        emergent:'emergent', sequence:'sequence', none:'none' };

const DIAG = {
  conformant:{label:'Conformant', title:'All regions match global',
    body:'Every region that responded performs this as the global SOP describes. No action.'},
  sop_problem:{label:'SOP problem', title:'Every region deviates the same way',
    body:'When nobody follows the SOP and they all diverge identically, the SOP is the outlier — not the regions. This is a strong candidate to amend globally rather than to enforce.'},
  regional_outlier:{label:'Regional outlier', title:'One region out of line',
    body:'The rest of the network conforms, so the SOP is workable as written. Correct the individual region.'},
  fragmented:{label:'Fragmented', title:'Regions deviate differently',
    body:'No shared practice exists here. Harmonising matters more than which version wins — decide the target state first, then roll it out.'},
  no_data:{label:'No data', title:'Nobody has answered this step',
    body:'No completed session covers this step yet. Run a review first.'}
};

const CELL_DETAIL = {
  aligned:  'Performs this as the global SOP describes.',
  localdoc: 'Follows the local document where it conflicts with global.',
  stale:    'Practice follows the global document — the local sheet is stale.',
  coverage: 'Parts of the global SOP are not performed.',
  omitted:  'The step is skipped entirely, or handled by another team.',
  role:     'Front office responsibility — doing this step here is a role deviation.',
  sequence: 'All required sub-steps happen, but not in the documented order.',
  emergent: 'Does additional work not described in either document.',
  none:     'No response recorded for this step.'
};

let ANALYSIS = null;          // { proc, regions, steps:[{no,name,owner,cells:{R:{t,note,started_at}}}], dropoff, emergent }
let analysisSelIdx = null;

async function renderAnalysis(host){
  host.innerHTML = `
    <h2 class="page">Analysis</h2>
    <p class="lede">Cross-region results, one process at a time. Every answer that isn't “matches global” is a deviation — what matters is the pattern across each row.</p>
    <div class="field" style="max-width:440px">
      <label>Process</label>
      <select class="fld" id="analysisPick" onchange="loadAnalysisView(this.value)"></select>
    </div>
    <div id="analysisBody"></div>`;
  const pick = document.getElementById('analysisPick');
  const body = document.getElementById('analysisBody');
  try{
    const idx = await loadAnalysisIndex();
    pick.innerHTML = idx.processes.map(p=>
      `<option value="${esc(p.id)}">${esc(p.name)}${idx.withSessions.has(p.id)?'':' — no sessions yet'}</option>`).join('');
    const first = idx.processes.find(p => idx.withSessions.has(p.id)) || idx.processes[0];
    if(!first){
      body.innerHTML = `<p class="lede" style="margin-top:16px">No processes yet — create one in the library first.</p>`;
      return;
    }
    await loadAnalysisView(first.id);
  }catch(e){
    body.innerHTML = `<p class="lede" style="margin-top:16px;color:var(--red)">Couldn't load analysis: ${esc(e.message)}</p>`;
  }
}

async function loadAnalysisView(procId){
  const body = document.getElementById('analysisBody');
  body.innerHTML = '<p class="lede" style="margin-top:16px">Loading…</p>';
  try{
    const [proc, data] = await Promise.all([sGet('proc:'+procId, null), loadAnalysis(procId)]);
    if(!proc) throw new Error('Process not found.');

    // Collapse the grid into one cell per step × region.
    // The latest COMPLETE session per region wins, so a half-finished
    // run never skews the matrix; diagnosis counts regions, not sessions.
    const sessById = new Map((data.sessions||[]).map(s=>[s.id,s]));
    const byStep = new Map();
    // steps carry the real PK as _id and the app-level id as id (step_no);
    // grid rows carry the real PK as step_id — match on that, falling back
    // to step_no for processes that were re-imported after sessions ran
    const pstepById = new Map((proc.steps||[]).map(p=>[p._id,p]));
    const pstepByNo  = new Map((proc.steps||[]).map(p=>[p.id,p]));
    const regionSet = new Set();
    (data.grid||[]).forEach(row=>{
      regionSet.add(row.region_code);
      if(row.session_status !== 'complete') return;
      let st = byStep.get(row.step_no);
      if(!st){
        const pstep = pstepById.get(row.step_id) || pstepByNo.get(row.step_no);
        st = { no:row.step_no, name:row.step_name, owner:row.global_office,
               agree:!!(pstep&&pstep.agree), global:(pstep&&pstep.global)||[],
               local:(pstep&&pstep.local)||[], cells:{} };
        byStep.set(row.step_no, st);
      }
      const c = st.cells[row.region_code];
      if(!c || new Date(row.started_at) > new Date(c.started_at)){
        st.cells[row.region_code] = { t: VERDICT_GLYPH[row.verdict] || 'none', note:row.note||'',
          started_at:row.started_at, sessionId:row.session_id,
          who:(sessById.get(row.session_id)||{}).participants||'' };
      }
    });
    const regions = REGIONS.filter(r=>regionSet.has(r))
      .concat([...regionSet].filter(r=>!REGIONS.includes(r)).sort());

    // latest complete session per region — that's what feeds each matrix cell
    const shownByRegion = {};
    (data.sessions||[]).forEach(s=>{
      if(s.status !== 'complete') return;
      const cur = shownByRegion[s.region_code];
      if(!cur || new Date(s.started_at) > new Date(cur.started_at)) shownByRegion[s.region_code] = s;
    });

    // responses keyed by `${session_id}|${step_no}` for the drilldown's
    // "full step as performed" sequence
    const noOf = {};
    (data.grid||[]).forEach(row=>{ noOf[row.step_id] = row.step_no; });
    const respByCell = new Map();
    (data.responses||[]).forEach(r=>{
      const no = noOf[r.step_id];
      if(!no) return;
      respByCell.set(r.session_id + '|' + no, {
        answer: r.answer, note: r.note||'',
        picks: (r.response_pick||[]).sort((a,b)=>a.seq-b.seq)
      });
    });

    // card assignment per cell — which document card A held for that
    // session — so a plain A/B answer can be named in the full-step view
    const assignByCell = new Map();
    (data.assignments||[]).forEach(a=>{
      const no = noOf[a.step_id]; if(!no) return;
      assignByCell.set(a.session_id + '|' + no, a.a_version);
    });

    ANALYSIS = { proc, regions, steps:[...byStep.values()], dropoff:data.dropoff||[],
                 emergent:data.emergent||[], sessions:data.sessions||[], shownByRegion,
                 responses:respByCell, assignments:assignByCell };
    analysisSelIdx = null;
    renderAnalysisBody();
  }catch(e){
    body.innerHTML = `<p class="lede" style="margin-top:16px;color:var(--red)">${esc(e.message)}</p>`;
  }
}

/* 'risk' cells are three different things wearing one verdict. Name the
   one that actually happened — the local doc followed, the step not
   done, or a role deviation (front-office steps force the verdict
   regardless of the pick, so they never claim a document). */
function analysisCellType(s, t, resp){
  if(t!=='coverage' || !resp) return t;
  const ans = resp.answer;
  if(s.owner==='front') return 'role';
  if((ans==='a' || ans==='b') && (s.local||[]).length) return 'localdoc';
  if(ans==='skip') return 'omitted';
  return 'coverage';
}

/* Row diagnosis — the core analytical move. Whether a deviation is
   the SOP's fault or a region's is a property of the ROW, not the
   cell. Mirrors v_step_diagnosis exactly. */
function analysisDiagnose(step){
  const cells = ANALYSIS.regions.map(r => (step.cells[r]||{t:'none'}).t).filter(t => t !== 'none');
  if(!cells.length) return 'no_data';
  const devs = cells.filter(t => t !== 'aligned' && t !== 'stale');
  if(!devs.length) return 'conformant';
  if(devs.length === cells.length) return new Set(devs).size === 1 ? 'sop_problem' : 'fragmented';
  return devs.length === 1 ? 'regional_outlier' : 'fragmented';
}

function renderAnalysisBody(){
  const host = document.getElementById('analysisBody');
  if(!ANALYSIS) return;
  const { proc, regions, steps, dropoff, emergent } = ANALYSIS;
  const REG = regions;
  if(!steps.length || !REG.length){
    host.innerHTML = `<p class="lede" style="margin-top:16px">No completed sessions yet — run a review for this process first, then come back here.</p>`;
    return;
  }

  // headline conformance
  let total=0, conforming=0;
  const typeCount = {};
  steps.forEach(s=>REG.forEach(r=>{
    const c=s.cells[r]; if(!c || c.t==='none') return;
    total++;
    if(c.t==='aligned' || c.t==='stale') conforming++;
    if(c.t!=='aligned') typeCount[c.t]=(typeCount[c.t]||0)+1;
  }));
  const pct = total? Math.round(conforming/total*100):0;
  const devOrder = ['stale','coverage','sequence','emergent'];
  const maxDev = Math.max(1,...devOrder.map(k=>typeCount[k]||0));
  const bars = devOrder.map(k=>`
    <div class="bar">
      <span class="bl">${DEV[k].label}</span>
      <span class="track"><span class="fill" style="width:${((typeCount[k]||0)/maxDev*100)}%;background:var(--${k})"></span></span>
      <span class="bn">${typeCount[k]||0}</span>
    </div>`).join('');

  // matrix
  const rows = steps.map((s,i)=>{
    const dg = analysisDiagnose(s);
    const cells = REG.map(r=>{
      const c = s.cells[r]||{t:'none'};
      const t = c.t in DEV ? c.t : 'none';
      const resp = (c.sessionId && ANALYSIS.responses) ? ANALYSIS.responses.get(c.sessionId + '|' + s.no) : null;
      const rt = analysisCellType(s, t, resp);
      return `<td class="cell"><span class="dot ${rt}" title="${r} — ${DEV[rt].label}: ${DEV[rt].hint}${c.note?' ('+esc(c.note)+')':''}${c.who?' — '+esc(c.who):''}">${DEV[rt].code}</span></td>`;
    }).join('');
    return `<tr class="${analysisSelIdx===i?'sel':''}" onclick="analysisSel(${i})">
      <td class="stepc"><span class="id">${esc(s.no)}</span><span class="nm">${esc(s.name)}</span>
        <span class="own">Global owner: ${s.owner==='back'?'Back office':'Front office'}</span></td>
      ${cells}
      <td class="diagc"><span class="diag ${dg}">${DIAG[dg].label}</span></td>
    </tr>`;
  }).join('');

  // control drop-off (v_control_dropoff)
  const missRows = dropoff.map(d=>`
    <div class="covrow" title="${esc(d.body||'')} — skipped by ${esc(d.regions.join(', '))}">
      <span class="ct"><b>${esc(d.step_no)}(${esc(d.ref)})</b> ${esc(d.step_name)}
        <span class="cb">${esc(d.body||'')}</span>
        <span class="cr">Skipped by ${esc(d.regions.join(', '))}</span></span>
      <span class="track"><span class="fill" style="width:${Math.min(100,d.regions_skipping/REG.length*100)}%"></span></span>
      <span class="cn">${d.regions_skipping}/${REG.length}<span class="cl">regions</span></span>
    </div>`).join('');

  // emergent register (v_emergent_register)
  const emRows = emergent.map(e=>`
    <div class="emrow">
      <span class="rc">${esc(e.region_code)}</span>
      <span class="rn">${esc(e.step_no)} · ${esc(e.step_name)}</span>
      <span class="rt">${esc(e.custom_body)}${e.submitted_by?` <span style="color:var(--ink-faint)">— by ${esc(e.submitted_by)}</span>`:''}</span>
    </div>`).join('');

  // who submitted (every session for this process, newest first)
  const subRows = ANALYSIS.sessions
    .filter(s => s.status !== 'abandoned')
    .sort((a,b) => new Date(b.started_at) - new Date(a.started_at))
    .map(s => {
      const shown = ANALYSIS.shownByRegion[s.region_code]?.id === s.id;
      return `<div class="emrow">
        <span class="rc">${esc(s.region_code)}</span>
        <span class="rn">${esc(s.participants)||'—'} · ${new Date(s.started_at).toLocaleString()}</span>
        <span class="rt">${s.status==='complete'?'Complete':'In progress'}${shown?' · <b>shown in matrix</b>':''}</span>
      </div>`;
    }).join('');

  // action buckets
  const buckets = {sop_problem:[], regional_outlier:[], fragmented:[]};
  steps.forEach(s=>{ const d=analysisDiagnose(s); if(buckets[d]) buckets[d].push(s); });
  const bl = arr => arr.length
    ? arr.map(s=>`<b>${esc(s.no)}</b> ${esc(s.name)}`).join('<br>')
    : '<span style="color:var(--ink-faint)">None.</span>';

  host.innerHTML = `
    <div class="an">
    <h2 class="page">${esc(proc.name)}</h2>
    <p class="lede">${esc(proc.domain||'')}${proc.domain?' · ':''}${REG.length} region${REG.length===1?'':'s'} surveyed · ${steps.length} steps. Answers that follow the global SOP conform, including cases where the local document is stale. What matters is the pattern across each row.</p>

    <div class="head">
      <div class="score">
        <div class="n" style="color:${pct>=75?'var(--aligned)':pct>=50?'var(--source)':'var(--coverage)'}">${pct}%</div>
        <div class="l">Conformance<br>${conforming} of ${total} answers</div>
      </div>
      <div class="bars">${bars}</div>
    </div>

    <div class="sect">Step × region matrix
      <span class="h">Each cell is the latest completed session in that region. Read across a row: if every region deviates the same way, the SOP is the problem — not the regions.</span></div>
    <div class="mx">
      <table>
        <thead><tr><th>Step</th>${REG.map(r=>`<th class="rg">${esc(r)}</th>`).join('')}<th class="dg">Diagnosis</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="sect">Who submitted
      <span class="h">Everyone who ran this process, newest first. The latest completed session per region is what the matrix shows — hover a cell for its exact submitter, or click a row for the per-region drilldown.</span></div>
    <div class="cov">${subRows || '<p style="font-size:13px;color:var(--ink-faint)">No submissions yet.</p>'}</div>

    <div class="keypanel">
      ${['aligned','localdoc','stale','coverage','omitted','role','sequence','emergent','none'].map(k=>
        `<div class="keyitem">
           <span class="lk" style="background:var(--${k}-bg);color:var(--${k})">${DEV[k].code}</span>
           <span class="ktxt"><b>${DEV[k].label}</b><em>${DEV[k].hint}</em></span>
         </div>`).join('')}
    </div>

    <div id="analysisDrill"></div>

    <div class="sect">Which global controls get dropped
      <span class="h">Sub-steps of the global SOP that regions reported not performing. The count is how many regions surveyed skipped it — a control missed by most regions is either unworkable as written or not understood.</span></div>
    <div class="cov">${missRows || '<p style="font-size:13px;color:var(--ink-faint)">No sub-step level gaps recorded.</p>'}</div>

    <div class="sect">Emergent practices
      <span class="h">Work reported that appears in neither document — candidates to formalise.</span></div>
    <div class="cov">${emRows || '<p style="font-size:13px;color:var(--ink-faint)">No extra practices recorded.</p>'}</div>

    <div class="sect">What to do next
      <span class="h">Grouped by who needs to change — the SOP, a region, or the network.</span></div>
    <div class="act">
      <div class="actcard amend">
        <div class="ah">Amend the global SOP</div>
        <div class="ad">All regions deviate identically. Enforcing this is unlikely to work; the SOP doesn't describe how the work is really done.</div>
        <div class="al">${bl(buckets.sop_problem)}</div>
      </div>
      <div class="actcard correct">
        <div class="ah">Correct a single region</div>
        <div class="ad">The rest of the network conforms, so the SOP is workable. Address the outlier directly.</div>
        <div class="al">${bl(buckets.regional_outlier)}</div>
      </div>
      <div class="actcard harmonise">
        <div class="ah">Harmonise first</div>
        <div class="ad">Regions diverge in different directions. Agree a target state before enforcing anything.</div>
        <div class="al">${bl(buckets.fragmented)}</div>
      </div>
    </div>
    </div>`;

  if(analysisSelIdx!==null) renderAnalysisDrill(steps[analysisSelIdx]);
}

function renderAnalysisDrill(s){
  const dg = analysisDiagnose(s);
  // invert the drop-off list: region -> missed global refs on this step
  const missByRegion = {};
  ANALYSIS.dropoff.forEach(d=>{
    if(d.step_no !== s.no) return;
    (d.regions||[]).forEach(rg=>{ (missByRegion[rg]=missByRegion[rg]||[]).push(d.ref); });
  });
  const rows = ANALYSIS.regions.map(r=>{
    const c = s.cells[r]||{t:'none'};
    const t = c.t in DEV ? c.t : 'none';
    const resp = (c.sessionId && ANALYSIS.responses) ? ANALYSIS.responses.get(c.sessionId + '|' + s.no) : null;
    // same refined type as the matrix dot, so chip and cell always agree
    const rt = analysisCellType(s, t, resp);
    let detail = c.note ? c.note : CELL_DETAIL[rt];
    // front-office steps carry a role-deviation reading, not the generic text
    if(s.owner==='front' && t!=='none'){
      const role = (t==='aligned')
        ? 'Front office responsibility — not doing this step is correct.'
        : 'Front office responsibility — doing this step here is a role deviation.';
      detail = role + (c.note ? ' — ' + c.note : '');
    }
    const miss = missByRegion[r];
    const qs = [];
    if(miss) qs.push(`Global sub-steps not performed: <b>${esc(miss.join(', '))}</b>`);
    if(c.who) qs.push(`Submitted by <b>${esc(c.who)}</b>`);
    // the full step as performed, whatever the answer — mix sequences are
    // replayed verbatim, other answers are synthesised from the version
    // the region says it follows
    const seq = analysisFullSeqHTML(s, t, resp, c.sessionId);
    return `<div class="rrow">
      <span class="rcode">${esc(r)}</span>
      <span class="rtype" style="background:var(--${rt}-bg);color:var(--${rt})">${DEV[rt].code} ${DEV[rt].label}</span>
      <span class="rdet">${esc(detail)}${qs.map(q=>`<span class="q">${q}</span>`).join('')}${seq}</span>
    </div>`;
  }).join('');

  document.getElementById('analysisDrill').innerHTML = `
    <div class="drill">
      <h3><span class="id">${esc(s.no)}</span>${esc(s.name)}</h3>
      <div class="dsub">Global SOP assigns this to <b>${s.owner==='back'?'Back office':'Front office'}</b></div>
      <div class="verdictbox ${dg}">
        <div class="vt">${DIAG[dg].title}</div>
        ${DIAG[dg].body}
      </div>
      <div class="rgrid">${rows}</div>
    </div>`;
}

/* The full step as performed for one region row, whatever the answer.
   Mix answers replay the exact sequence the reviewer built (customs
   marked as extras). Every other answer synthesises the full sub-step
   set of the version the region says it follows — the shared doc for
   agree steps, the picked card for plain A/B answers (the session's
   card assignment says which document A was; the 'stale' glyph is the
   fallback when no assignment was saved). Steps the region doesn't do,
   and steps nobody answered, have no sequence to show. */
function analysisFullSeq(s, t, resp, sessionId){
  if(!resp || !resp.answer) return null;
  const ans = resp.answer;
  if(ans==='skip' || ans==='none') return null;
  if(resp.picks && resp.picks.length) return resp.picks;
  let list=null, version=null;
  if(s.agree){
    list = s.global||[]; version='global';
  } else if(ans==='a' || ans==='b'){
    const aIs = ANALYSIS.assignments.get(sessionId+'|'+s.no);
    const picked = aIs ? ((ans==='a') ? aIs : (aIs==='global' ? 'local' : 'global'))
                       : (t==='stale' ? 'global' : 'local');   // no assignment saved: read it off the verdict
    list = picked==='global' ? (s.global||[]) : (s.local||[]);
    version = picked;
  } else {
    list = s.global||[]; version='global';   // extra / partial — the documented step is the reference
  }
  if(!list.length) return null;
  return list.map(d=>({ substep:{ body:d.text, version } }));
}
function analysisFullSeqHTML(s, t, resp, sessionId){
  const seq = analysisFullSeq(s, t, resp, sessionId);
  return seq && seq.length ? analysisSeqHTML(seq) : '';
}

/* The complete sequence a region reported for one step (mix answers),
   in execution order — custom items are marked as extras. */
function analysisSeqHTML(picks){
  const items = picks.map((p,i)=>{
    const n = i+1;
    if(p.source === 'custom'){
      return `<li class="seq-item seq-extra"><span class="sq">+</span><span class="st">${esc(p.custom_body||'')}</span><span class="seq-src">extra</span></li>`;
    }
    const body = (p.substep && p.substep.body) ? p.substep.body : '';
    const src = p.substep ? (p.substep.version==='global'?'global':'local') : p.source;
    return `<li class="seq-item"><span class="sq">${n}.</span><span class="st">${esc(body||'')}</span><span class="seq-src">${esc(src)}</span></li>`;
  });
  const extras = picks.filter(p=>p.source==='custom').length;
  const head = extras
    ? `Full step as performed — <b class="seq-extra-txt">${extras} extra step${extras>1?'s':''} added, in neither document</b>`
    : 'Full step as performed';
  return `<div class="seqbox"><div class="seqhead">${head}</div><ol class="seqlist">${items.join('')}</ol></div>`;
}

function analysisSel(i){
  analysisSelIdx = (analysisSelIdx===i ? null : i);
  renderAnalysisBody();
  if(analysisSelIdx!==null){
    const d = document.getElementById('analysisDrill');
    if(d) d.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}

/* ============================================================
   SESSIONS — records management
   List every review run, view a record's per-step answers, or
   delete one. Deleting cascades to its assignments and responses.
   ============================================================ */
let SESS_PROCESSES = [];

async function renderSessions(host){
  host.innerHTML = `
    <h2 class="page">Sessions</h2>
    <p class="lede">Every review run, newest first. View a record to see each step's answer, or delete one to correct bad data — deleting removes the session and all its answers.</p>
    <div class="row" style="margin-bottom:14px">
      <select class="fld" id="sessFilter" style="max-width:320px" onchange="loadSessions(this.value)">
        <option value="">All processes</option>
      </select>
      <span class="spacer"></span>
      <button class="btn sm" onclick="loadSessions(document.getElementById('sessFilter').value)">Refresh</button>
    </div>
    <div id="sessList"><p class="lede">Loading…</p></div>`;
  try{
    SESS_PROCESSES = await loadProcessIndex();
    const pick = document.getElementById('sessFilter');
    pick.innerHTML = '<option value="">All processes</option>' +
      SESS_PROCESSES.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
    await loadSessions('');
  }catch(e){
    document.getElementById('sessList').innerHTML = `<p class="lede" style="color:var(--red)">${esc(e.message)}</p>`;
  }
}

async function loadSessions(processId){
  const list = document.getElementById('sessList');
  if(!list) return;
  list.innerHTML = '<p class="lede">Loading…</p>';
  try{
    const rows = await dbListSessions(processId || null);
    if(!rows.length){ list.innerHTML = '<p class="lede">No sessions recorded yet.</p>'; return; }
    const chip = s => `<span class="schip ${s}">${{in_progress:'In progress',complete:'Complete',abandoned:'Abandoned'}[s]||s}</span>`;
    const totalFor = pid => (SESS_PROCESSES.find(p=>p.id===pid)||{}).steps ?? '?';
    list.innerHTML = `
      <div class="sess-table">
        <div class="sess-head"><span>Started</span><span>Process</span><span>Region</span><span>Submitted by</span><span>Status</span><span>Answered</span><span></span></div>
        ${rows.map(r=>`
          <div class="sess-row">
            <span class="s-date">${new Date(r.started_at).toLocaleString()}</span>
            <span>${esc(r.process)}</span>
            <span class="s-region">${esc(r.region)}</span>
            <span>${esc(r.name)||'—'}</span>
            <span>${chip(r.status)}</span>
            <span>${r.answered} / ${totalFor(r.process_id)}</span>
            <span class="s-acts">
              <button class="btn sm" onclick="viewSession('${r.id}')">View</button>
              <button class="btn sm danger" onclick="deleteSession('${r.id}')">Delete</button>
            </span>
          </div>`).join('')}
      </div>
      <div id="sessDetail"></div>`;
  }catch(e){
    list.innerHTML = `<p class="lede" style="color:var(--red)">${esc(e.message)}</p>`;
  }
}

/* The full step for one session-record row, whatever the answer — the
   same logic as the analysis drilldown, but from the stored session
   shape: mix answers replay the built sequence (app-side A/B refs
   resolved back to the documents), every other answer synthesises the
   full sub-step set of the version it names. Steps not performed (or
   unanswered) have no sequence. */
function sessionFullPicks(st, r, assign){
  const val = r.val;
  if(!val || val==='skip') return null;
  if(r.picks && r.picks.length){
    const aIs = (assign||{})[st.id]==='local' ? 'local' : 'global';
    return r.picks.map(k=>{
      const [side, ref] = k.split(':');
      if(side==='c') return { source:'custom', custom_body:(r.customs||{})[ref]||'' };
      const isLocal = (side==='a') ? aIs==='local' : aIs!=='local';
      const arr = isLocal ? (st.local||[]) : (st.global||[]);
      const d = arr.find(x=>x.ref===ref);
      return { substep:{ ref, version: isLocal?'local':'global', body: d ? d.text : '' } };
    });
  }
  let list=null, version=null;
  if(st.agree){
    list = st.global||[]; version='global';
  } else if(val==='a' || val==='b'){
    const aIs = (assign||{})[st.id]==='global' ? 'global' : 'local';
    const picked = (val==='a') ? aIs : (aIs==='global' ? 'local' : 'global');
    list = picked==='global' ? (st.global||[]) : (st.local||[]);
    version = picked;
  } else {
    list = st.global||[]; version='global';   // extra / partial — the documented step is the reference
  }
  if(!list.length) return null;
  return list.map(d=>({ substep:{ body:d.text, version } }));
}

async function viewSession(id){
  const detail = document.getElementById('sessDetail');
  if(!detail) return;
  detail.innerHTML = '<p class="lede">Loading…</p>';
  try{
    const s = await dbLoadSessionById(id);
    const proc = await sGet('proc:'+s.process_id, null);
    if(!s || !proc) throw new Error('Session or process not found.');
    const counts = {aligned:0,risk:0,stale:0,emergent:0,sequence:0,none:0};
    const rows = proc.steps.map(st=>{
      const r = s.responses[st.id]||{};
      const v = classify(st, r.val, r.picks, s.assign, s.responses)||'none';
      counts[v]++;
      const note = r.note&&r.note.trim()?esc(r.note.trim()):'<em>No detail captured.</em>';
      const picked = (st.agree ? ANS_AGREE : ANS_DIFFER).find(x=>x.val===r.val);
      const seq = sessionFullPicks(st, r, s.assign);
      return `<div class="sum-row">
        <span class="badge ${v}">${VLABEL[v]}</span>
        <div class="body">
          <div class="name"><span class="id">${esc(st.id)}</span>${esc(st.name)}</div>
          ${picked?`<div class="action" style="border-left-color:var(--teal)"><b style="font-family:var(--mono);font-size:11px">Selected</b><br>${esc(picked.title)}</div>`:''}
          <div class="note">${note}</div>
          ${seq?`<div class="action" style="border-left-color:var(--violet)">${analysisSeqHTML(seq)}</div>`:''}
          <div class="action"${v==='none'?' style="border-left-color:var(--amber);color:var(--amber)"':''}>${esc(v!=='none'?VERDICT_ACTION[v]:VERDICT_ACTION_NONE)}</div>
        </div></div>`;
    }).join('');
    detail.innerHTML = `
      <div class="drill" style="margin-top:16px">
        <h3>Session record</h3>
        <div class="dsub"><b>${esc(s.region)}</b> · ${esc(s.name)||'no name'} · ${esc(proc.name)} · started ${new Date(s.started_at).toLocaleString()}${s.completed_at?' · completed '+new Date(s.completed_at).toLocaleString():''}</div>
        <div class="tally">
          <div><div class="n" style="color:var(--teal)">${counts.aligned}</div><div class="l">Aligned</div></div>
          <div><div class="n" style="color:var(--red)">${counts.risk}</div><div class="l">Risk</div></div>
          <div><div class="n" style="color:var(--amber)">${counts.stale}</div><div class="l">Stale</div></div>
          <div><div class="n" style="color:var(--violet)">${counts.emergent}</div><div class="l">New</div></div>
          <div><div class="n" style="color:var(--sequence)">${counts.sequence}</div><div class="l">Order</div></div>
          <div><div class="n" style="color:var(--ink-faint)">${counts.none}</div><div class="l">No answer</div></div>
        </div>
        ${rows}
        <div class="nav">
          <span class="spacer"></span>
          <button class="btn" onclick="document.getElementById('sessDetail').innerHTML=''">Close</button>
        </div>
      </div>`;
    detail.scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){
    detail.innerHTML = `<p class="lede" style="color:var(--red)">${esc(e.message)}</p>`;
  }
}

async function deleteSession(id){
  const ok = await askConfirm({
    title:'Delete this session?',
    body:'Removes the record and all its answers. This cannot be undone.',
    okText:'Delete', danger:true
  });
  if(!ok) return;
  try{
    await dbDeleteSession(id);
    await loadSessions(document.getElementById('sessFilter').value);
  }catch(e){ saveFailed(e.message); }
}

/* surface uncaught errors in the top bar so a failed save can't hide */
window.addEventListener('error', e=>{
  const h = document.getElementById('saveHint');
  if(h){ h.textContent = 'Error: ' + (e.message||'unknown'); h.style.color = '#FF9C8A'; }
});

/* ---------- boot ---------- */
(async function(){
  DB.index = await sGet('proc:index', null) || [];
  render();
})();
</script>
</body>
</html>
